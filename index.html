    let siteData = loadSiteDataFromStorage();

    function loadSiteDataFromStorage() {
      try {
        const raw = localStorage.getItem('smpn02_martapura_portal_v3');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.sekolah) {
            const mergedSekolah = { ...defaultSiteData.sekolah, ...(parsed.sekolah || {}) };
            if (!mergedSekolah.logoUrl || mergedSekolah.logoUrl.includes('placehold.co/96x96')) {
              mergedSekolah.logoUrl = OFFICIAL_LOGO_SVG;
            }
            return {
              ...defaultSiteData,
              ...parsed,
              sekolah: mergedSekolah,
              statistik: { ...defaultSiteData.statistik, ...(parsed.statistik || {}) },
              rombel: { ...defaultSiteData.rombel, ...(parsed.rombel || {}) },
              juaraKelas: { ...defaultSiteData.juaraKelas, ...(parsed.juaraKelas || {}) },
              juaraUmum: { ...defaultSiteData.juaraUmum, ...(parsed.juaraUmum || {}) },
              rekapEkskul: { ...defaultSiteData.rekapEkskul, ...(parsed.rekapEkskul || {}) }
            };
          }
        }
      } catch (e) {
        console.warn('Memuat data bawaan portal:', e);
      }
      return JSON.parse(JSON.stringify(defaultSiteData));
    }

    async function syncFromSupabaseCloud() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('portal_data')
          .select('payload')
          .eq('id', SUPABASE_ROW_ID)
          .maybeSingle();

        if (error) {
          console.warn('Supabase sync read:', error.message);
          return;
        }

        if (data && data.payload && data.payload.sekolah) {
          const mergedSekolah = { ...defaultSiteData.sekolah, ...(data.payload.sekolah || {}) };
          if (!mergedSekolah.logoUrl || mergedSekolah.logoUrl.includes('placehold.co/96x96')) {
            mergedSekolah.logoUrl = OFFICIAL_LOGO_SVG;
          }
          siteData = {
            ...defaultSiteData,
            ...data.payload,
            sekolah: mergedSekolah,
            statistik: { ...defaultSiteData.statistik, ...(data.payload.statistik || {}) },
            rombel: { ...defaultSiteData.rombel, ...(data.payload.rombel || {}) },
            juaraKelas: { ...defaultSiteData.juaraKelas, ...(data.payload.juaraKelas || {}) },
            juaraUmum: { ...defaultSiteData.juaraUmum, ...(data.payload.juaraUmum || {}) },
            rekapEkskul: { ...defaultSiteData.rekapEkskul, ...(data.payload.rekapEkskul || {}) }
          };
          try {
            localStorage.setItem('smpn02_martapura_portal_v3', JSON.stringify(siteData));
          } catch (e) {}
          syncSchoolBrandUI();
          renderPage(currentPage);
        } else {
          await pushToSupabaseCloud();
        }
      } catch (err) {
        console.warn('Gagal memuat data cloud Supabase:', err);
      }
    }

    async function pushToSupabaseCloud() {
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient
          .from('portal_data')
          .upsert(
            {
              id: SUPABASE_ROW_ID,
              payload: siteData,
              updated_at: new Date().toISOString()
            },
            { onConflict: 'id' }
          );

        if (error) {
          console.warn('Supabase sync write:', error.message);
          if (currentPage === 'admin') {
            showToast('Tersimpan lokal, namun gagal sinkron ke Supabase: ' + error.message);
          }
        }
      } catch (err) {
        console.warn('Gagal mengirim ke Supabase:', err);
      }
    }

    function saveSiteDataToStorage() {
      try {
        localStorage.setItem('smpn02_martapura_portal_v3', JSON.stringify(siteData));
      } catch (e) {
        console.warn('Penyimpanan lokal penuh:', e);
        showToast('Peringatan: Memori browser hampir penuh. Gunakan foto ukuran lebih ringkas atau unduh cadangan JSON.');
      }
      syncSchoolBrandUI();
      pushToSupabaseCloud();
    }

    function syncSchoolBrandUI() {
      const s = siteData.sekolah;
      const logoEls = ['school-logo', 'topbar-logo'];
      logoEls.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.src = s.logoUrl || OFFICIAL_LOGO_SVG;
      });
      const favEl = document.getElementById('school-favicon');
      if (favEl && s.logoUrl) favEl.href = s.logoUrl;
      const shortEl = document.getElementById('school-short-name');
      if (shortEl) shortEl.textContent = s.namaSingkat;
      const fullEl = document.getElementById('school-full-name');
      if (fullEl) fullEl.textContent = s.namaLengkap;
      const topNameEl = document.getElementById('topbar-school-name');
      if (topNameEl) topNameEl.textContent = s.namaLengkap.toUpperCase();
      const topSubEl = document.getElementById('topbar-school-sub');
      if (topSubEl) topSubEl.textContent = s.kabupaten;
      const npsnEl = document.getElementById('sidebar-npsn');
      if (npsnEl) npsnEl.textContent = `NPSN: ${s.npsn} • OKU Timur`;
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      const txt = document.getElementById('toastMessage');
      if (!box || !txt) return;
      txt.textContent = msg;
      box.classList.remove('hidden');
      box.classList.add('flex');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        box.classList.add('hidden');
        box.classList.remove('flex');
      }, 3000);
    }

    function applySidebarLayout() {
      const sidebar = document.getElementById('sidebar-menu');
      const overlay = document.getElementById('sidebarOverlay');
      const topBrand = document.getElementById('topBrandInfo');
      const topNav = document.getElementById('topNavLinks');
      const isMobile = window.innerWidth < 768;

      if (!sidebar) return;

      if (isSidebarOpen) {
        if (isMobile) {
          sidebar.className = 'fixed inset-y-0 left-0 z-40 bg-gradient-to-b from-[#f5faff] via-[#eaf3fe] to-[#dcebfb] text-[#09254d] flex flex-col transition-all duration-300 ease-in-out shadow-[8px_0_30px_rgba(6,45,104,0.2)] border-r border-blue-200/90 overflow-hidden flex-shrink-0';
          sidebar.style.width = '280px';
          sidebar.style.minWidth = '280px';
          if (overlay) overlay.classList.remove('hidden');
        } else {
          sidebar.className = 'relative inset-y-0 left-0 z-40 bg-gradient-to-b from-[#f5faff] via-[#eaf3fe] to-[#dcebfb] text-[#09254d] flex flex-col transition-all duration-300 ease-in-out shadow-[8px_0_30px_rgba(6,45,104,0.12)] border-r border-blue-200/90 overflow-hidden flex-shrink-0';
          sidebar.style.width = '280px';
          sidebar.style.minWidth = '280px';
          if (overlay) overlay.classList.add('hidden');
        }
        if (topBrand) topBrand.style.display = 'none';
        if (topNav) topNav.style.display = 'none';
      } else {
        sidebar.style.width = '0px';
        sidebar.style.minWidth = '0px';
        sidebar.classList.remove('border-r');
        if (overlay) overlay.classList.add('hidden');
        if (topBrand) topBrand.style.display = 'flex';
        if (topNav) topNav.style.display = window.innerWidth >= 1024 ? 'flex' : 'none';
      }
    }

    function handleGlobalSearch(rawQuery) {
      const q = (rawQuery || '').trim();
      const sInp = document.getElementById('sidebarSearchInput');
      const tInp = document.getElementById('topGlobalSearchInput');
      if (sInp && sInp.value !== q) sInp.value = q;
      if (tInp && tInp.value !== q) tInp.value = q;

      if (q.length < 2) return;
      const ql = q.toLowerCase();

      const matchPtk = siteData.ptk.filter(p =>
        p.nama.toLowerCase().includes(ql) ||
        p.jabatan.toLowerCase().includes(ql) ||
        (p.pendidikan || '').toLowerCase().includes(ql)
      );
      const matchPeng = siteData.pengumuman.filter(p =>
        p.judul.toLowerCase().includes(ql) || p.ringkasan.toLowerCase().includes(ql)
      );
      const matchEks = siteData.ekskul.filter(e =>
        e.nama.toLowerCase().includes(ql) || e.deskripsi.toLowerCase().includes(ql)
      );

      clearTimeout(window.__searchModalTimer);
      window.__searchModalTimer = setTimeout(() => {
        openGlobalModal(`Hasil Pencarian: "${q}"`, `
          <div class="space-y-4 text-xs">
            <div>
              <p class="font-extrabold text-[#062d68] mb-2">Guru & Tenaga Administrasi (${matchPtk.length})</p>
              ${matchPtk.length ? matchPtk.slice(0, 5).map(p => `
                <div onclick="closeGlobalModal(); ptkState.search='${q.replace(/'/g, '')}'; navigate('${p.kategori === 'tendik' ? 'ptk-tendik' : 'ptk-guru'}')" class="p-2.5 mb-1.5 rounded-xl bg-sky-50 hover:bg-sky-100 border border-blue-100 flex items-center justify-between cursor-pointer">
                  <div>
                    <p class="font-bold text-[#062d68]">${p.nama}</p>
                    <p class="text-slate-600">${p.jabatan} • <span class="text-[#0b469e] font-semibold">${p.pendidikan || 'S1 Pendidikan'}</span></p>
                  </div>
                  <span class="px-2.5 py-0.5 rounded-full bg-[#062d68] text-white text-[10px] font-bold">${p.status}</span>
                </div>
              `).join('') : '<p class="text-slate-400 italic">Tidak ada data PTK yang cocok.</p>'}
            </div>
            <div>
              <p class="font-extrabold text-[#062d68] mb-2">Pengumuman (${matchPeng.length})</p>
              ${matchPeng.length ? matchPeng.slice(0, 4).map(p => `
                <div onclick="closeGlobalModal(); openPengumumanModal(${p.id})" class="p-2.5 mb-1.5 rounded-xl bg-amber-50/70 hover:bg-amber-100/70 border border-amber-200 cursor-pointer">
                  <p class="font-bold text-[#062d68]">${p.judul}</p>
                  <p class="text-slate-500">${p.kategori} • ${p.tanggal}</p>
                </div>
              `).join('') : '<p class="text-slate-400 italic">Tidak ada pengumuman yang cocok.</p>'}
            </div>
            <div>
              <p class="font-extrabold text-[#062d68] mb-2">Ekstrakurikuler (${matchEks.length})</p>
              ${matchEks.length ? matchEks.map(e => `
                <div onclick="closeGlobalModal(); ekskulState.selectedId='${e.id}'; navigate('ekskul-daftar')" class="p-2.5 mb-1.5 rounded-xl bg-white hover:bg-sky-50 border border-blue-200 cursor-pointer font-bold text-[#062d68]">
                  ${e.nama} — ${e.pembina}
                </div>
              `).join('') : '<p class="text-slate-400 italic">Tidak ada ekstrakurikuler yang cocok.</p>'}
            </div>
          </div>
        `);
      }, 450);

    function navigate(pageId) {
      if (pageId === 'admin' && !adminState.unlocked) {
        openAdminGate();
        return;
      }
      currentPage = pageId;
      document.querySelectorAll('.top-dropdown').forEach(el => el.classList.add('hidden'));
      if (window.innerWidth < 768 && isSidebarOpen) {
        closeSidebar();
      }

      const pageLabels = {
        beranda: 'Beranda',
        profil: 'Profil Sekolah',
        'ptk-guru': 'PTK • Data Guru',
        'ptk-tendik': 'PTK • Tenaga Administrasi',
        'siswa-rombel': 'Siswa • Data & Rombel',
        'siswa-pencapaian': 'Siswa • Pencapaian',
        'ekskul-daftar': 'Ekstrakurikuler',
        'ekskul-pencapaian': 'Pencapaian Ekstrakurikuler',
        pengumuman: 'Pengumuman Sekolah',
        admin: 'Panel Administrator'
      };

      const titleEl = document.getElementById('page-title');
      if (titleEl) titleEl.textContent = pageLabels[pageId] || 'Beranda';

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isMatch = btn.getAttribute('data-nav') === pageId;
        if (isMatch) {
          btn.classList.add('bg-[#062d68]', 'text-white', 'shadow-sm');
          btn.classList.remove('text-[#09254d]', 'text-slate-700');
          const ic = btn.querySelector('i');
          if (ic) {
            ic.classList.remove('text-[#0b469e]');
            ic.classList.add('text-amber-300');
          }
        } else {
          btn.classList.remove('bg-[#062d68]', 'text-white', 'shadow-sm');
          const ic = btn.querySelector('i');
          if (ic) {
            ic.classList.add('text-[#0b469e]');
            ic.classList.remove('text-amber-300');
          }
        }
      });

      const topGroup = pageId.startsWith('ptk')
        ? 'ptk'
        : pageId.startsWith('siswa')
        ? 'siswa'
        : pageId.startsWith('ekskul')
        ? 'ekskul'
        : pageId;
      document.querySelectorAll('.top-nav-item').forEach(btn => {
        if (btn.getAttribute('data-topnav') === topGroup) {
          btn.classList.add('bg-white', 'text-[#062d68]', 'font-extrabold', 'shadow-xs');
          btn.classList.remove('text-sky-100');
        } else {
          btn.classList.remove('bg-white', 'text-[#062d68]', 'font-extrabold', 'shadow-xs');
          btn.classList.add('text-sky-100');
        }
      });

      renderPage(pageId);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPage(pageId) {
      const container = document.getElementById('app-content');
      if (!container) return;

      if (heroAutoTimer) {
        clearInterval(heroAutoTimer);
        heroAutoTimer = null;
      }

      switch (pageId) {
        case 'profil':
          container.innerHTML = renderProfilPage();
          break;
        case 'ptk-guru':
          container.innerHTML = renderPtkPage('guru');
          break;
        case 'ptk-tendik':
          container.innerHTML = renderPtkPage('tendik');
          break;
        case 'siswa-rombel':
          container.innerHTML = renderSiswaRombelPage();
          break;
        case 'siswa-pencapaian':
          container.innerHTML = renderPencapaianSiswaPage();
          break;
        case 'ekskul-daftar':
          container.innerHTML = renderEkskulDaftarPage();
          break;
        case 'ekskul-pencapaian':
          container.innerHTML = renderEkskulPencapaianPage();
          break;
        case 'pengumuman':
          container.innerHTML = renderPengumumanPage();
          break;
        case 'admin':
          container.innerHTML = renderAdminPage();
          break;
        case 'beranda':
        default:
          container.innerHTML = renderBerandaPage();
          startHeroSlider();
          break;
      }

    function openImagePreviewModal(title, src, caption = '') {
      openGlobalModal(title, `
        <div class="space-y-3 text-center">
          <div class="rounded-2xl overflow-hidden bg-slate-900 border border-blue-200 flex items-center justify-center">

          </div>
          ${caption ? `<p class="text-xs text-slate-600 font-medium">${caption}</p>` : ''}
        </div>
      `);
    }

    function openProfilImageByType(type) {
      const s = siteData.sekolah;
      if (type === 'gedung') {
        openImagePreviewModal(`Gedung Utama ${s.namaLengkap}`, s.heroBannerUrl, s.alamat);
      } else if (type === 'visimisi') {
        openImagePreviewModal(`Program Karakter & Literasi ${s.namaLengkap}`, s.fotoVisiMisi || s.heroBannerUrl, s.visi);
      } else if (type === 'struktur') {
        const st = s.strukturOrganisasi || defaultSiteData.sekolah.strukturOrganisasi;

      openImagePreviewModal(`${sr.nama} (${sr.jumlah})`, sr.foto, `Kondisi Fasilitas: ${sr.kondisi} • ${siteData.sekolah.namaLengkap}`);
    }

    // =========================================================================
    // 5. HALAMAN BERANDA (SESUAI DESAIN RESMI SMPN 02 MARTAPURA)
    // =========================================================================
    function setHeroSlide(idx) {
      const slides = siteData.sekolah.heroSlides || [];
      if (!slides.length) return;
      heroSlideIdx = (idx + slides.length) % slides.length;
      const sl = slides[heroSlideIdx];
      const imgEl = document.getElementById('heroBannerImg');
      const titleEl = document.getElementById('heroBannerTitle');
      const subEl = document.getElementById('heroBannerSub');
      if (imgEl) imgEl.src = sl.gambar;
      if (titleEl) titleEl.textContent = sl.judul;
      if (subEl) subEl.textContent = sl.subjudul;
      document.querySelectorAll('.hero-slide-dot').forEach((d, i) => {
        d.className = i === heroSlideIdx
          ? 'hero-slide-dot w-2.5 h-2.5 rounded-full bg-[#062d68] ring-2 ring-white transition cursor-pointer'
          : 'hero-slide-dot w-2.5 h-2.5 rounded-full bg-white/80 hover:bg-white transition cursor-pointer';
      });
    }

    function startHeroSlider() {
      const slides = siteData.sekolah.heroSlides || [];
      if (slides.length <= 1) return;
      heroAutoTimer = setInterval(() => {
        setHeroSlide(heroSlideIdx + 1);
      }, 6500);
    }

    // =========================================================================
    // 7. HALAMAN PTK (GURU & TENAGA ADMINISTRASI) - MODE SWIPE
    // =========================================================================
    function changePtkSlide(step) {
      const total = ptkState.totalSlides || 1;
      if (total <= 1) return;
      ptkState.slide = (ptkState.slide + step + total) % total;
      updatePtkSwipeUI();
    }

    function goToPtkSlide(idx) {
      const total = ptkState.totalSlides || 1;
      ptkState.slide = Math.max(0, Math.min(idx, total - 1));
      updatePtkSwipeUI();
    }

    function updatePtkSwipeUI() {
      const track = document.getElementById('ptkSwipeTrack');
      const counter = document.getElementById('ptkSlideCounter');
      if (track) {
        track.style.transform = `translateX(-${ptkState.slide * 100}%)`;
      }
      if (counter) {
        counter.textContent = `Slide ${ptkState.slide + 1} dari ${ptkState.totalSlides}`;
      }
      document.querySelectorAll('.ptk-slide-dot').forEach((dot, i) => {
        if (i === ptkState.slide) {
          dot.className = 'ptk-slide-dot h-2.5 w-7 rounded-full bg-[#062d68] transition-all cursor-pointer';
        } else {
          dot.className = 'ptk-slide-dot h-2.5 w-2.5 rounded-full bg-blue-200 hover:bg-blue-400 transition-all cursor-pointer';
        }
      });
    }

    function handlePtkTouchStart(e) {
      if (!e.touches || !e.touches.length) return;
      ptkState.touchStartX = e.touches[0].clientX;
      ptkState.touchStartY = e.touches[0].clientY;
    }

    function handlePtkTouchEnd(e) {
      if (!e.changedTouches || !e.changedTouches.length) return;
      const dx = e.changedTouches[0].clientX - ptkState.touchStartX;
      const dy = e.changedTouches[0].clientY - ptkState.touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        if (dx < 0) changePtkSlide(1);
        else changePtkSlide(-1);
      }
    }

    function handlePtkMouseDown(e) {
      ptkState.touchStartX = e.clientX;
      ptkState.touchStartY = e.clientY;
    }

    function handlePtkMouseUp(e) {
      const dx = e.clientX - ptkState.touchStartX;
      const dy = e.clientY - ptkState.touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx < 0) changePtkSlide(1);
        else changePtkSlide(-1);
      }
    }

    function renderPtkPage(defaultCat) {
      if (defaultCat && ptkState.lastRoute !== defaultCat) {
        ptkState.tab = defaultCat;
        ptkState.lastRoute = defaultCat;
        ptkState.slide = 0;
      }
      const activeCat = ptkState.tab || defaultCat || 'guru';
      const q = ptkState.search.toLowerCase();
      const statusFilter = ptkState.filter;
      const eduFilter = ptkState.eduFilter;

      const filtered = siteData.ptk.filter(p => {
        const matchCat = activeCat === 'semua' || p.kategori === activeCat;
        const matchStatus = statusFilter === 'Semua' || p.status === statusFilter;
        const eduText = (p.pendidikan || 'S1 Pendidikan').toUpperCase();
        const matchEdu = eduFilter === 'Semua' || eduText.startsWith(eduFilter);
        const matchSearch =
          !q ||
          p.nama.toLowerCase().includes(q) ||
          p.jabatan.toLowerCase().includes(q) ||
          (p.pendidikan || '').toLowerCase().includes(q) ||
          p.nip.toLowerCase().includes(q);
        return matchCat && matchStatus && matchEdu && matchSearch;
      });

      const perSlide = window.innerWidth < 640 ? 3 : window.innerWidth < 1024 ? 4 : 6;
      const slides = [];
      for (let i = 0; i < filtered.length; i += perSlide) {
        slides.push(filtered.slice(i, i + perSlide));
      }
      ptkState.totalSlides = Math.max(1, slides.length);
      if (ptkState.slide >= ptkState.totalSlides) {
        ptkState.slide = 0;
      }

      const isTendik = activeCat === 'tendik';

      return `
        <div class="animate-page space-y-6">
          ${buildPageHero({
            icon: isTendik ? 'fa-user-tie' : 'fa-chalkboard-teacher',
            title: isTendik ? 'Tenaga Administrasi & Kependidikan' : 'Pendidik & Tenaga Kependidikan (PTK)',
            subtitle: 'Direktori lengkap profil Guru dan Staf Tata Usaha beserta kualifikasi pendidikan terakhir dan status kepegawaian.',
            breadcrumb: ['PTK', isTendik ? 'Tenaga Administrasi' : 'Data Guru']

              <div class="flex flex-wrap gap-2">

                  { id: 'guru', label: `Data Guru (${siteData.ptk.filter(x => x.kategori === 'guru').length})` },
                  { id: 'tendik', label: `Tenaga Administrasi (${siteData.ptk.filter(x => x.kategori === 'tendik').length})` },

                ].map(t => `
                  <button onclick="ptkState.tab = '${t.id}'; ptkState.slide = 0; renderPage('${t.id === 'tendik' ? 'ptk-tendik' : 'ptk-guru'}')" class="px-4 py-2 rounded-full text-xs font-extrabold transition cursor-pointer ${activeCat === t.id ? 'bg-[#062d68] text-white shadow' : 'bg-white text-[#0b469e] border border-blue-200 hover:bg-sky-50'}">
                    ${t.label}
                  </button>
                `).join('')}
              </div>

              <!-- Input Cari -->
              <div class="relative w-full sm:w-72">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" value="${ptkState.search}" oninput="ptkState.search = this.value; ptkState.slide = 0; renderPage(currentPage)" placeholder="Cari nama, mapel, NIP, pendidikan..." class="w-full pl-9 pr-4 py-2 rounded-full bg-white border border-blue-200 text-xs text-[#062d68] focus:outline-none focus:border-[#0b469e]" />
              </div>
            </div>

            <!-- Filter Status & Pendidikan Terakhir -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-blue-100 text-xs">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="font-bold text-slate-500 mr-1">Status:</span>
                ${['Semua', 'PNS', 'PPPK', 'Honorer'].map(st => `
                  <button onclick="ptkState.filter = '${st}'; ptkState.slide = 0; renderPage(currentPage)" class="px-3 py-1 rounded-full font-bold transition cursor-pointer ${statusFilter === st ? 'bg-[#0b469e] text-white' : 'bg-white border border-blue-200 text-slate-600 hover:bg-sky-50'}">
                    ${st}
                  </button>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <span class="font-bold text-slate-500 mr-1">Pendidikan:</span>
                ${['Semua', 'S2', 'S1', 'D3', 'SMA'].map(ed => `
                  <button onclick="ptkState.eduFilter = '${ed}'; ptkState.slide = 0; renderPage(currentPage)" class="px-3 py-1 rounded-full font-bold transition cursor-pointer ${eduFilter === ed ? 'bg-amber-400 text-[#062d68]' : 'bg-white border border-blue-200 text-slate-600 hover:bg-sky-50'}">
                    ${ed}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Area Swipe Kartu PTK -->
          ${filtered.length ? `
            <div class="space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2 px-1 text-xs">
                <div class="flex items-center gap-2 font-bold text-[#062d68]">
                  <span class="w-7 h-7 rounded-full bg-sky-100 text-[#0b469e] flex items-center justify-center">
                    <i class="fas fa-arrows-left-right text-xs"></i>
                  </span>
                  <span>Geser (Swipe) ke kiri atau kanan untuk melihat ${isTendik ? 'Tenaga Administrasi' : 'Guru'} lainnya</span>
                </div>
                <div class="flex items-center gap-2">
                  <span id="ptkSlideCounter" class="px-3 py-1 rounded-full bg-white border border-blue-200 font-extrabold text-[#062d68]">
                    Slide ${ptkState.slide + 1} dari ${ptkState.totalSlides}
                  </span>
                  <button onclick="changePtkSlide(-1)" title="Sebelumnya" class="w-8 h-8 rounded-full bg-white hover:bg-[#062d68] text-[#062d68] hover:text-white border border-blue-200 flex items-center justify-center transition cursor-pointer">

                  </button>
                  <button onclick="changePtkSlide(1)" title="Berikutnya" class="w-8 h-8 rounded-full bg-white hover:bg-[#062d68] text-[#062d68] hover:text-white border border-blue-200 flex items-center justify-center transition cursor-pointer">
                    <i class="fas fa-chevron-right text-xs"></i>
                  </button>

              <div

                class="overflow-hidden rounded-3xl select-none cursor-grab active:cursor-grabbing"

                <div id="ptkSwipeTrack" style="transform: translateX(-${ptkState.slide * 100}%);" class="flex transition-transform duration-300 ease-out">
                  ${slides.map(slideItems => `
                    <div class="w-full flex-shrink-0 grid sm:grid-cols-2 lg:grid-cols-3 gap-5 p-0.5">

                        const statusBadge = p.status === 'PNS'
                          ? 'bg-emerald-100 text-emerald-800 border-emerald-200'

      `;

    // =========================================================================
    // 8. HALAMAN SISWA – DATA & ROMBEL
    // =========================================================================
    function renderSiswaRombelPage() {
      const levels = ['VII', 'VIII', 'IX'];
      const summary = levels.map(lv => {
        const list = siteData.rombel[lv] || [];
        const l = list.reduce((acc, r) => acc + (Number(r.laki) || 0), 0);
        const p = list.reduce((acc, r) => acc + (Number(r.perempuan) || 0), 0);
        return { level: lv, rombelCount: list.length, laki: l, perempuan: p, total: l + p };
      });
      const grandTotalL = summary.reduce((a, b) => a + b.laki, 0);
      const grandTotalP = summary.reduce((a, b) => a + b.perempuan, 0);
      const grandTotal = grandTotalL + grandTotalP;
      const activeList = siteData.rombel[rombelActive] || [];

      return `
        <div class="animate-page space-y-6">
          ${buildPageHero({
            icon: 'fa-user-graduate',
            title: 'Data Peserta Didik & Rombongan Belajar',
            subtitle: `Rekapitulasi jumlah peserta didik laki-laki, perempuan, dan wali kelas per rombongan belajar Tahun Ajaran ${siteData.sekolah.tahunAjaran}.`,
            breadcrumb: ['Siswa', 'Data & Rombel']
          })}

          <!-- Ringkasan Statistik Per Tingkat -->
          <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            ${summary.map(sm => `
              <div onclick="rombelActive = '${sm.level}'; renderPage('siswa-rombel')" class="glossy-panel card-hover rounded-3xl p-5 cursor-pointer ${rombelActive === sm.level ? 'ring-2 ring-[#0b469e]' : ''}">
                <div class="flex items-center justify-between">
                  <span class="px-3 py-1 rounded-full bg-[#062d68] text-amber-300 text-xs font-extrabold">Kelas ${sm.level}</span>
                  <span class="text-xs font-bold text-[#0b469e]">${sm.rombelCount} Rombel</span>
                </div>
                <p class="text-2xl sm:text-3xl font-extrabold text-[#062d68] mt-3">${sm.total} <span class="text-xs font-semibold text-slate-500">Siswa</span></p>
                <p class="text-[11px] text-slate-600 mt-1">Laki-laki: <b>${sm.laki}</b> • Perempuan: <b>${sm.perempuan}</b></p>
              </div>
            `).join('')}

            <div class="rounded-3xl p-5 bg-gradient-to-br from-[#062d68] to-[#0b469e] text-white border-b-4 border-amber-400 shadow-md">
              <div class="flex items-center justify-between">
                <span class="px-3 py-1 rounded-full bg-amber-400 text-[#062d68] text-xs font-extrabold">Total Sekolah</span>
                <i class="fas fa-users text-amber-300"></i>
              </div>
              <p class="text-2xl sm:text-3xl font-extrabold mt-3">${grandTotal} <span class="text-xs font-normal text-sky-100">Siswa</span></p>
              <p class="text-[11px] text-sky-100 mt-1">Laki-laki: <b>${grandTotalL}</b> • Perempuan: <b>${grandTotalP}</b></p>
            </div>
          </div>

          <!-- Daftar Rombel Tingkat Aktif -->
          <div class="glossy-panel rounded-3xl p-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-blue-100 pb-4">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-[#062d68]">Daftar Rombongan Belajar Kelas ${rombelActive}</h2>
                <p class="text-xs text-slate-500">Klik pada kartu kelas untuk melihat rincian ruang dan komposisi siswa</p>
              </div>
              <div class="flex gap-2">
                ${levels.map(lv => `
                  <button onclick="rombelActive = '${lv}'; renderPage('siswa-rombel')" class="px-4 py-2 rounded-full text-xs font-extrabold transition cursor-pointer ${rombelActive === lv ? 'bg-[#062d68] text-white shadow' : 'bg-white text-[#0b469e] border border-blue-200 hover:bg-sky-50'}">
                    Tingkat ${lv}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${activeList.map(r => `
                <div onclick="openRombelModal('${rombelActive}', '${r.kelas}')" class="p-5 rounded-2xl bg-white border border-blue-200/90 card-hover cursor-pointer space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="px-3.5 py-1 rounded-full bg-gradient-to-r from-[#062d68] to-[#0b469e] text-white text-xs font-extrabold">
                      Kelas ${r.kelas}
                    </span>
                    <span class="text-[11px] font-bold text-[#0b469e] bg-sky-50 px-2.5 py-1 rounded-full border border-blue-100">
                      ${r.ruangan}
                    </span>
                  </div>
                  <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Wali Kelas</p>
                    <p class="text-xs sm:text-sm font-extrabold text-[#062d68] mt-0.5">${r.wali}</p>
                  </div>
                  <div class="pt-2.5 border-t border-blue-100 flex items-center justify-between text-xs">
                    <span class="text-slate-600">L: <b>${r.laki}</b> • P: <b>${r.perempuan}</b></span>
                    <span class="font-extrabold text-[#062d68]">Total: ${r.laki + r.perempuan}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function openRombelModal(tingkat, kelasNama) {
      const r = (siteData.rombel[tingkat] || []).find(item => item.kelas === kelasNama);

      openGlobalModal(`Rincian Rombongan Belajar • Kelas ${r.kelas}`, `
        <div class="space-y-4">
          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="p-3.5 rounded-2xl bg-sky-50 border border-blue-200">

              <p class="font-bold text-[#062d68] mt-0.5">${r.ruangan}</p>
            </div>
          </div>
          <div class="p-4 rounded-2xl bg-[#062d68] text-white border-b-2 border-[#eab308] flex items-center justify-around text-center">

              <p class="text-xl font-extrabold text-amber-300">${r.laki}</p>
              <p class="text-[11px] text-sky-100">Siswa Laki-laki</p>
            </div>
            <div class="h-8 w-px bg-white/20"></div>
            <div>
              <p class="text-xl font-extrabold text-amber-300">${r.perempuan}</p>
              <p class="text-[11px] text-sky-100">Siswa Perempuan</p>
            </div>
            <div class="h-8 w-px bg-white/20"></div>

    // =========================================================================
    // 10. HALAMAN EKSTRAKURIKULER – DAFTAR & DETAIL KEGIATAN
    // =========================================================================
    function openEkskulGaleriModal(ekskulId, fotoIdx) {
      const ex = siteData.ekskul.find(e => e.id === ekskulId);
      if (!ex || !ex.galeriFoto || !ex.galeriFoto[fotoIdx]) return;
      const item = ex.galeriFoto[fotoIdx];
      openImagePreviewModal(`${ex.nama} • ${item.judul}`, item.foto, `Dokumentasi Kegiatan Ekstrakurikuler ${ex.nama} ${siteData.sekolah.namaLengkap}`);
    }

    function renderEkskulDaftarPage() {
      const selected = ekskulState.selectedId
        ? siteData.ekskul.find(e => e.id === ekskulState.selectedId)
        : null;

      if (!selected) {
        return `

    // =========================================================================
    // 13. PENGATURAN ADMIN LENGKAP + UPLOAD FOTO, EXCEL PTK & DATA JSON
    // =========================================================================
    function checkSecretAdminUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const queryCode = (params.get('akses') || '').trim();
        const hashCode = window.location.hash.replace(/^#/, '').trim();
        const isValidSecret =
          encodeSecret(queryCode) === URL_SECRET_HASH ||
          encodeSecret(hashCode) === URL_SECRET_HASH;
        if (isValidSecret) {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname);
          }
          if (adminState.unlocked) {
            navigate('admin');
          } else {
            openAdminGate();
          }
        }
      } catch (e) {
        console.warn('Pemeriksaan tautan akses:', e);
      }
    }

    function toggleAdminPassVisibility() {
      const inp = document.getElementById('adminPinInput');
      const icon = document.getElementById('adminPassEyeIcon');
      if (!inp) return;
      if (inp.type === 'password') {
        inp.type = 'text';
        if (icon) icon.className = 'fas fa-eye-slash text-xs';
      } else {
        inp.type = 'password';
        if (icon) icon.className = 'fas fa-eye text-xs';
      }
    }

    function openAdminGate() {
      if (adminState.unlocked) {
        navigate('admin');
        return;
      }
      openGlobalModal('Verifikasi Administrator Sekolah', `

    function handlePhotoFileUpload(event, inputId, previewId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = inputId === 'admStrukturFoto' ? 1440 : 680;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.85);
          const inp = document.getElementById(inputId);
          const prev = document.getElementById(previewId);
          if (inp) inp.value = compressed;
          if (prev) prev.src = compressed;
          showToast('Foto berhasil dimuat! Klik Simpan untuk menerapkan.');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handlePtkExcelImport(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Pustaka Excel belum siap, coba muat ulang halaman.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rawRows.length) {
            showToast('File Excel kosong atau tidak memiliki baris data.');
            return;
          }

          let importedCount = 0;
          const importedItems = [];

          rawRows.forEach(row => {
            const norm = {};
            Object.keys(row).forEach(k => {
              norm[k.toLowerCase().trim()] = String(row[k] ?? '').trim();
            });

            const nama =
              norm['nama lengkap & gelar'] ||
              norm['nama lengkap'] ||
              norm['nama'] ||
              '';
            if (!nama || nama.toLowerCase().startsWith('contoh:')) return;

            const nip = norm['nip / ni pppk'] || norm['nip'] || '-';
            const katRaw = (norm['kategori (guru/tendik)'] || norm['kategori'] || 'guru').toLowerCase();
            const kategori = katRaw.includes('tendik') || katRaw.includes('admin') || katRaw.includes('tu') ? 'tendik' : 'guru';
            const jabatan =
              norm['mata pelajaran / jabatan'] ||
              norm['jabatan'] ||
              norm['mapel'] ||
              (kategori === 'tendik' ? 'Staf Administrasi' : 'Guru Mata Pelajaran');
            const pendidikan =
              norm['pendidikan terakhir'] ||
              norm['pendidikan'] ||
              norm['ijazah'] ||
              'S1 Pendidikan';
            const statusRaw = (norm['status (pns/pppk/honorer)'] || norm['status'] || 'PNS').toUpperCase();
            const status = statusRaw.includes('PPPK') ? 'PPPK' : statusRaw.includes('HONOR') ? 'Honorer' : 'PNS';

            const initials = nama
              .replace(/[^a-zA-Z\s]/g, '')
              .trim()
              .split(/\s+/)
              .slice(0, 2)
              .map(w => w[0]?.toUpperCase() || '')
              .join('') || 'PTK';

            importedItems.push({
              nama,
              nip,
              kategori,
              jabatan,
              pendidikan,
              status,
              foto: `https://placehold.co/200x200/0b469e/fde047?text=${encodeURIComponent(initials)}`
            });
            importedCount++;
          });

          if (importedCount === 0) {
            showToast('Tidak ditemukan baris valid (pastikan kolom Nama terisi).');
            return;
          }

          const replaceMode = document.getElementById('admExcelReplaceMode')?.checked;
          if (replaceMode) {
            siteData.ptk = importedItems;
          } else {
            siteData.ptk = [...importedItems, ...siteData.ptk];
          }

          saveSiteDataToStorage();
          renderPage('admin');
          showToast(`Berhasil mengimpor ${importedCount} data Guru/Tendik dari Excel!`);
        } catch (err) {
          showToast('Gagal membaca file Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

      renderPage('admin');

      const ruangan = document.getElementById('admRomRuang')?.value.trim() || 'Gedung A';
      if (!kelas) {
        showToast('Mohon isi Nama Kelas terlebih dahulu.');
        return;
      }
      if (!Array.isArray(siteData.rombel[tk])) siteData.rombel[tk] = [];
      if (adminState.editRombelIdx >= 0) {
        siteData.rombel[tk][adminState.editRombelIdx] = { kelas, wali, laki, perempuan, ruangan };
        adminState.editRombelIdx = -1;
        showToast(`Data kelas ${kelas} berhasil diperbarui!`);
      } else {
        siteData.rombel[tk].push({ kelas, wali, laki, perempuan, ruangan });
        showToast(`Slot kelas ${kelas} berhasil ditambahkan!`);
      }
      saveSiteDataToStorage();
      renderPage('admin');

    function deleteAdminRombel(idx) {
      const tk = adminState.rombelTingkat || 'VII';

        siteData.rombel[tk].splice(idx, 1);
        adminState.editRombelIdx = -1;
        saveSiteDataToStorage();
        renderPage('admin');
        showToast('Slot kelas berhasil dihapus.');
      }
    }

      const siswa = document.getElementById('admPresSiswa')?.value.trim();
      const tingkat = document.getElementById('admPresTingkat')?.value.trim() || 'Kabupaten OKU Timur';
      const tahun = document.getElementById('admPresTahun')?.value.trim() || '2026';
      const medali = document.getElementById('admPresMedali')?.value || 'Emas';
      if (!judul || !siswa) {
        showToast('Mohon isi Judul Lomba dan Nama Siswa.');
        return;
      }
      siteData.prestasiSiswa.unshift({ judul, siswa, tingkat, tahun, medali });
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Prestasi siswa berhasil ditambahkan!');
    }

    function syncCurrentEkskulDraft() {
      if (adminState.editEkskulIdx < 0 || !siteData.ekskul[adminState.editEkskulIdx]) return;
      const ex = siteData.ekskul[adminState.editEkskulIdx];
      const bannerEl = document.getElementById('admEksBanner');
      const namaEl = document.getElementById('admEksNama');
      const katEl = document.getElementById('admEksKat');
      const pembinaEl = document.getElementById('admEksPembina');
      const ketuaEl = document.getElementById('admEksKetua');
      const jadwalEl = document.getElementById('admEksJadwal');
      const tempatEl = document.getElementById('admEksTempat');
      const deskEl = document.getElementById('admEksDesk');

      if (bannerEl && bannerEl.value.trim()) ex.bannerFoto = bannerEl.value.trim();
      if (namaEl && namaEl.value.trim()) ex.nama = namaEl.value.trim();
      if (katEl && katEl.value.trim()) ex.kategori = katEl.value.trim();
      if (pembinaEl && pembinaEl.value.trim()) ex.pembina = pembinaEl.value.trim();
      if (ketuaEl && ketuaEl.value.trim()) ex.ketua = ketuaEl.value.trim();
      if (jadwalEl && jadwalEl.value.trim()) ex.jadwal = jadwalEl.value.trim();
      if (tempatEl && tempatEl.value.trim()) ex.tempat = tempatEl.value.trim();
      if (deskEl && deskEl.value.trim()) ex.deskripsi = deskEl.value.trim();

      if (Array.isArray(ex.timelineProgram)) {
        ex.timelineProgram = ex.timelineProgram.map((item, idx) => {
          const bInp = document.getElementById(`admProgBulan_${idx}`);
          const kInp = document.getElementById(`admProgKeg_${idx}`);
          return {
            bulan: bInp ? (bInp.value.trim() || item.bulan) : item.bulan,
            kegiatan: kInp ? (kInp.value.trim() || item.kegiatan) : item.kegiatan
          };
        });
      }

      if (Array.isArray(ex.galeriFoto)) {
        ex.galeriFoto = ex.galeriFoto.map((gl, idx) => {
          const fInp = document.getElementById(`admEksGalFoto_${idx}`);
          const jInp = document.getElementById(`admEksGalJudul_${idx}`);
          return {
            foto: fInp ? (fInp.value.trim() || gl.foto) : gl.foto,
            judul: jInp ? (jInp.value.trim() || gl.judul) : gl.judul
          };
        });
      }
    }

    function addEkskulProgramRow() {
      if (adminState.editEkskulIdx < 0 || !siteData.ekskul[adminState.editEkskulIdx]) return;
      syncCurrentEkskulDraft();
      const ex = siteData.ekskul[adminState.editEkskulIdx];
      const bulan = document.getElementById('admNewProgBulan')?.value.trim() || 'Juli';
      const kegiatan = document.getElementById('admNewProgKegiatan')?.value.trim();
      if (!kegiatan) {
        showToast('Mohon isi Nama Program Kerja / Kegiatan baru terlebih dahulu.');
        return;
      }
      if (!Array.isArray(ex.timelineProgram)) ex.timelineProgram = [];
      ex.timelineProgram.push({ bulan, kegiatan });
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Program kerja baru berhasil ditambahkan!');
    }

    function removeEkskulProgramRow(pIdx) {
      if (adminState.editEkskulIdx < 0 || !siteData.ekskul[adminState.editEkskulIdx]) return;
      syncCurrentEkskulDraft();
      const ex = siteData.ekskul[adminState.editEkskulIdx];
      if (Array.isArray(ex.timelineProgram)) {
        ex.timelineProgram.splice(pIdx, 1);
      }
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Baris program kerja berhasil dihapus.');
    }

    function addEkskulGaleriPhoto() {
      if (adminState.editEkskulIdx < 0 || !siteData.ekskul[adminState.editEkskulIdx]) return;
      syncCurrentEkskulDraft();
      const ex = siteData.ekskul[adminState.editEkskulIdx];
      const foto = document.getElementById('admNewGaleriFoto')?.value.trim();
      const judul = document.getElementById('admNewGaleriJudul')?.value.trim() || `Dokumentasi Kegiatan ${ex.nama}`;
      if (!foto) {
        showToast('Mohon pilih foto dari perangkat atau tempel tautan gambar.');
        return;
      }
      if (!Array.isArray(ex.galeriFoto)) ex.galeriFoto = [];
      ex.galeriFoto.unshift({ judul, foto });
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Foto kegiatan berhasil ditambahkan ke galeri ekskul!');
    }

    function removeEkskulGaleriPhoto(gIdx) {
      if (adminState.editEkskulIdx < 0 || !siteData.ekskul[adminState.editEkskulIdx]) return;
      syncCurrentEkskulDraft();
      const ex = siteData.ekskul[adminState.editEkskulIdx];
      if (Array.isArray(ex.galeriFoto)) {
        ex.galeriFoto.splice(gIdx, 1);
      }
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Foto kegiatan berhasil dihapus dari galeri.');
    }

    function saveAdminEkskul() {
      const bannerFoto = document.getElementById('admEksBanner')?.value.trim() || 'https://placehold.co/900x360/0b469e/fde047?text=Ekstrakurikuler';
      const nama = document.getElementById('admEksNama').value.trim();
      const kategori = document.getElementById('admEksKat').value.trim() || 'Pengembangan Bakat';
      const pembina = document.getElementById('admEksPembina').value.trim() || 'Pembina Ekskul';
      const ketua = document.getElementById('admEksKetua')?.value.trim() || 'Ketua Ekskul';
      const jadwal = document.getElementById('admEksJadwal').value.trim() || 'Sabtu, 14.00 – 16.00 WIB';
      const tempat = document.getElementById('admEksTempat')?.value.trim() || 'Lapangan SMPN 02 Martapura';
      const deskripsi = document.getElementById('admEksDesk').value.trim() || 'Kegiatan ekstrakurikuler siswa.';
      if (!nama) {
        showToast('Mohon isi Nama Ekstrakurikuler.');
        return;
      }
      if (adminState.editEkskulIdx >= 0 && siteData.ekskul[adminState.editEkskulIdx]) {
        syncCurrentEkskulDraft();
        const old = siteData.ekskul[adminState.editEkskulIdx];
        siteData.ekskul[adminState.editEkskulIdx] = { ...old, bannerFoto, nama, kategori, pembina, ketua, jadwal, tempat, deskripsi };
        showToast(`Profil, Program Kerja & Foto ${nama} berhasil disimpan!`);
      } else {
        siteData.ekskul.push({
          id: 'eks-' + Date.now(),
          nama,
          kategori,
          pembina,
          ketua,
          jadwal,
          tempat,
          anggota: 45,
          ikon: 'fa-star',
          badgeBg: 'bg-[#0b469e]',
          iconColor: 'text-[#0b469e]',
          bannerFoto,
          deskripsi,
          kegiatan: ['Latihan Rutin Mingguan', 'Pembinaan Lomba Tingkat Kabupaten'],
          timelineProgram: [
            { bulan: 'Januari', kegiatan: 'Penerimaan & Orientasi Anggota Baru' },
            { bulan: 'Februari', kegiatan: 'Latihan Dasar & Penguatan Materi' },
            { bulan: 'Maret', kegiatan: 'Kegiatan Praktik Lapangan' },
            { bulan: 'April', kegiatan: 'Pelatihan Kepemimpinan & Kerja Sama' },
            { bulan: 'Mei', kegiatan: 'Persiapan Kompetisi Tingkat Kabupaten' },
            { bulan: 'Juni', kegiatan: 'Evaluasi Akhir Tahun & Pentas Karya' }
          ],
          prestasiList: [
            { juara: 1, judul: `Juara 1 Lomba ${nama}`, tingkat: 'Tingkat Kecamatan Martapura', tahun: 'Tahun 2026' }
          ],
          galeriFoto: defaultSiteData.ekskul[0].galeriFoto,
          pengurusInti: [{ jabatan: 'Ketua', nama: ketua, kelas: 'IX' }]
        });
        adminState.editEkskulIdx = siteData.ekskul.length - 1;
        showToast('Bidang ekstrakurikuler baru ditambahkan!');
      }
      saveSiteDataToStorage();
      renderPage('admin');
    }

    function saveAdminPencapaianEkskul() {
      const foto = document.getElementById('admPencEksFoto').value.trim() || 'https://placehold.co/600x340/0b469e/fde047?text=Prestasi+Ekskul';
      const ekskul = document.getElementById('admPencEksNama').value;
      const juara = parseInt(document.getElementById('admPencEksJuara').value, 10) || 1;
      const judul = document.getElementById('admPencEksJudul').value.trim();
      const event = document.getElementById('admPencEksEvent').value.trim() || 'Kompetisi Pelajar';
      const lokasi = document.getElementById('admPencEksLokasi').value.trim() || 'Kab. OKU Timur';
      if (!judul) {
        showToast('Mohon isi Judul Kejuaraan Ekskul.');
        return;
      }
      if (adminState.editPencapaianEkskulIdx >= 0) {
        const old = siteData.pencapaianEkskul[adminState.editPencapaianEkskulIdx];
        siteData.pencapaianEkskul[adminState.editPencapaianEkskulIdx] = { ...old, ekskul, juara, judul, event, lokasi, foto };
        adminState.editPencapaianEkskulIdx = -1;
        showToast('Pencapaian & foto ekskul berhasil diperbarui!');
      } else {
        siteData.pencapaianEkskul.unshift({
          ekskul,
          tahun: '2025/2026',
          juara,
          judul,
          event,
          tanggal: '22 November 2026',
          lokasi,
          foto
        });
        showToast('Pencapaian & foto ekskul berhasil ditambahkan!');
      }
      saveSiteDataToStorage();
      renderPage('admin');
    }

    function deleteAdminItem(collection, idx) {
      if (Array.isArray(siteData[collection])) {
        siteData[collection].splice(idx, 1);
        saveSiteDataToStorage();
        renderPage('admin');
        showToast('Data berhasil dihapus.');
      }
    }

    function downloadJsonFile() {
      const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'smpn02-martapura-data.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('File smpn02-martapura-data.json diunduh.');
    }

    function uploadJsonFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.sekolah) {
            siteData = parsed;
            saveSiteDataToStorage();
            renderPage('admin');
            showToast('Database JSON berhasil dimuat!');
          } else {
            showToast('Format JSON tidak valid.');
          }
        } catch (err) {
          showToast('Gagal membaca file JSON.');
        }
      };
      reader.readAsText(file);
    }

    function applyRawJson() {
      try {
        const raw = document.getElementById('rawJsonEditor').value;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.sekolah) {
          siteData = parsed;
          saveSiteDataToStorage();
          showToast('Data JSON berhasil diterapkan & disimpan!');
        } else {
          showToast('Struktur JSON harus memiliki objek "sekolah".');
        }
      } catch (err) {
        showToast('Kesalahan sintaks JSON: ' + err.message);
      }
    }

    function resetAllData() {
      siteData = JSON.parse(JSON.stringify(defaultSiteData));
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Seluruh data dikembalikan ke pengaturan awal.');
    }

    // =========================================================================
    // 14. MODAL GLOBAL & INISIALISASI HALAMAN
    // =========================================================================
    function openGlobalModal(title, bodyHtml) {
      const modal = document.getElementById('globalModal');
      const mTitle = document.getElementById('modalTitle');
      const mBody = document.getElementById('modalBody');
      if (!modal || !mTitle || !mBody) return;
      mTitle.textContent = title;
      mBody.innerHTML = bodyHtml;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeGlobalModal() {
      const modal = document.getElementById('globalModal');
      if (!modal) return;
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.getElementById('globalModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'globalModal') closeGlobalModal();
    });

    window.addEventListener('DOMContentLoaded', () => {
      syncSchoolBrandUI();
      applySidebarLayout();
      navigate('beranda');
      checkSecretAdminUrl();
      syncFromSupabaseCloud();
    });
    window.addEventListener('hashchange', checkSecretAdminUrl);
  </script>
