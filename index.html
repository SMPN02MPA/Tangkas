    // Helper normalisasi pendidikan terakhir untuk data lama di localStorage
    function inferPendidikanFromName(nama) {
      const n = String(nama || '');
      if (/M\.Pd|M\.Si|M\.Kom|M\.M|M\.H/i.test(n)) return 'S2';
      if (/S\.Pd|S\.Si|S\.Kom|S\.E|S\.Pust|S\.Sn|S\.Ag|Drs\.|Dra\./i.test(n)) return 'S1';
      if (/A\.Md/i.test(n)) return 'D3';
      return 'SMA / Sederajat';
    }

    // Muat data dari localStorage jika admin pernah menyimpan perubahan
    let siteData = (() => {
      try {
        const saved = localStorage.getItem('smpn02_martapura_data_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed.ptk)) {
            parsed.ptk = parsed.ptk.map(item => ({
              ...item,
              pendidikan: item.pendidikan || inferPendidikanFromName(item.nama)
            }));
          }
          return parsed;
        }
      } catch (e) {
        console.warn('Gagal membaca penyimpanan lokal:', e);
      }
      return JSON.parse(JSON.stringify(defaultSiteData));
    })();

    function saveSiteDataToStorage() {
      try {
        localStorage.setItem('smpn02_martapura_data_v1', JSON.stringify(siteData));
      } catch (e) {

      }
      syncSchoolBrandUI();

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      const txt = document.getElementById('toastMessage');
      if (!box || !txt) return;
      txt.textContent = msg;
      box.classList.remove('hidden');
      box.classList.add('flex');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.add('hidden');
        box.classList.remove('flex');
      }, 3000);
    }

    // =========================================================================
    function applySidebarLayout() {
      const sidebar = document.getElementById('sidebar-menu');
      const overlay = document.getElementById('sidebarOverlay');
      const topBrand = document.getElementById('topBrandInfo');
      const topNav = document.getElementById('topNavLinks');
      if (!sidebar) return;

      const isDesktop = window.innerWidth >= 768;
      if (isDesktop) {
        if (overlay) overlay.classList.add('hidden');
        if (isSidebarOpen) {
          sidebar.style.position = 'relative';
          sidebar.style.width = '280px';
          sidebar.style.minWidth = '280px';
          sidebar.style.transform = 'translateX(0)';
          sidebar.style.opacity = '1';
          if (topBrand) topBrand.style.display = 'none';
          if (topNav) topNav.style.display = 'none';
        } else {
          sidebar.style.position = 'fixed';
          sidebar.style.width = '0px';
          sidebar.style.minWidth = '0px';
          sidebar.style.transform = 'translateX(-100%)';
          sidebar.style.opacity = '0';
          if (topBrand) topBrand.style.display = 'flex';
          if (topNav) topNav.style.display = window.innerWidth >= 960 ? 'flex' : 'none';
        }
      } else {
        sidebar.style.position = 'fixed';
        sidebar.style.width = '280px';
        sidebar.style.minWidth = '280px';
        sidebar.style.opacity = '1';
        if (topBrand) topBrand.style.display = 'flex';
        if (topNav) topNav.style.display = 'none';
        if (isSidebarOpen) {
          sidebar.style.transform = 'translateX(0)';
          if (overlay) overlay.classList.remove('hidden');
        } else {
          sidebar.style.transform = 'translateX(-100%)';
          if (overlay) overlay.classList.add('hidden');
        }
      }
    }

    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      applySidebarLayout();
    }

    function closeSidebar() {
      isSidebarOpen = false;
      applySidebarLayout();
    }

    window.addEventListener('resize', () => {

    function handleGlobalSearch(query) {
      const q = (query || '').trim().toLowerCase();
      if (!q) return;
      if (q.includes('guru') || q.includes('nip') || q.includes('ptk') || q.includes('s1') || q.includes('s2') || q.includes('d3') || q.includes('pendidikan')) {
        ptkState.search = query;
        navigate('ptk-guru');
      } else if (q.includes('rombel') || q.includes('kelas') || q.includes('wali')) {
        navigate('siswa-rombel');
      } else if (q.includes('juara') || q.includes('osn') || q.includes('prestasi')) {
        navigate('siswa-pencapaian');
      } else if (q.includes('pramuka') || q.includes('pmr') || q.includes('ekskul')) {
        navigate('ekskul-daftar');
      } else if (q.includes('pengumuman') || q.includes('sas') || q.includes('dapodik')) {
        pengumumanState.search = query;
        navigate('pengumuman');
      }
    }

    function navigate(page) {
      if (page === 'admin' && !adminState.unlocked) {
        page = 'beranda';
      }
      currentPage = page;
      document.querySelectorAll('.top-dropdown').forEach(dd => dd.classList.add('hidden'));
      const pageTitleEl = document.getElementById('page-title');
      if (pageTitleEl) pageTitleEl.textContent = pageTitles[page] || 'Portal Sekolah';

      // Highlight Sidebar Active
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.getAttribute('data-nav') === page;
        if (isActive) {
          btn.classList.add('bg-gradient-to-r', 'from-[#8fc5fb]', 'to-[#b9dcff]', 'text-[#062d68]', 'font-extrabold', 'border-l-4', 'border-[#0b469e]', 'shadow-xs');
          btn.classList.remove('text-[#09254d]', 'text-slate-700');
        } else {
          btn.classList.remove('bg-gradient-to-r', 'from-[#8fc5fb]', 'to-[#b9dcff]', 'text-[#062d68]', 'font-extrabold', 'border-l-4', 'border-[#0b469e]', 'shadow-xs');
          btn.classList.add('text-[#09254d]');
        }
      });

      // Highlight Top Nav Active
      document.querySelectorAll('.top-nav-item').forEach(btn => {
        const key = btn.getAttribute('data-topnav');
        const activeMatch =
          key === page ||
          (key === 'ptk' && page.startsWith('ptk-')) ||
          (key === 'siswa' && page.startsWith('siswa-')) ||
          (key === 'ekskul' && page.startsWith('ekskul-'));
        if (activeMatch) {
          btn.classList.add('bg-white', 'text-[#062d68]', 'font-extrabold', 'shadow');
          btn.classList.remove('text-sky-100');
        } else {
          btn.classList.remove('bg-white', 'text-[#062d68]', 'font-extrabold', 'shadow');
          btn.classList.add('text-sky-100');
        }
      });

      if (window.innerWidth < 768) {
        isSidebarOpen = false;
        applySidebarLayout();
      }

      renderPage(page);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPage(page) {
      const container = document.getElementById('app-content');
      if (!container) return;
      switch (page) {
        case 'beranda':
          container.innerHTML = renderBerandaPage();
          break;
        case 'profil':
          container.innerHTML = renderProfilPage();
          break;
        case 'ptk-guru':
          container.innerHTML = renderPtkPage('guru');
          break;
        case 'ptk-tendik':
          container.innerHTML = renderPtkPage('tendik');
          break;
        case 'siswa-rombel':
          container.innerHTML = renderRombelPage();
          break;
        case 'siswa-pencapaian':
          container.innerHTML = renderPencapaianSiswaPage();
          break;
        case 'ekskul-daftar':
          container.innerHTML = renderEkskulDaftarPage();
          break;
        case 'ekskul-pencapaian':
          container.innerHTML = renderEkskulPencapaianPage();
          break;
        case 'pengumuman':
          container.innerHTML = renderPengumumanPage();
          break;
        case 'admin':
          container.innerHTML = renderAdminPage();
          break;
        default:
          container.innerHTML = renderBerandaPage();
      }
    }

    // =========================================================================
    // 7. HALAMAN DIREKTORI PTK (MODE GESER HORIZONTAL + FILTER PENDIDIKAN TERAKHIR)
    // =========================================================================
    function renderPtkPage(defaultTab) {
      if (defaultTab && (currentPage === 'ptk-guru' || currentPage === 'ptk-tendik')) {
        ptkState.tab = defaultTab;
      }
      const activeTab = ptkState.tab;
      const q = ptkState.search.toLowerCase();
      const filtered = siteData.ptk.filter(item => {
        const eduText = (item.pendidikan || '-').toLowerCase();
        const matchTab = activeTab === 'semua' || item.kategori === activeTab;
        const matchStatus = ptkState.filter === 'Semua' || item.status === ptkState.filter;
        const matchEdu = ptkState.eduFilter === 'Semua' || eduText.startsWith(ptkState.eduFilter.toLowerCase());
        const matchQuery =
          !q ||
          item.nama.toLowerCase().includes(q) ||
          item.jabatan.toLowerCase().includes(q) ||
          eduText.includes(q) ||
          item.nip.includes(q);
        return matchTab && matchStatus && matchEdu && matchQuery;
      });

      const totalGuru = siteData.ptk.filter(p => p.kategori === 'guru').length;
      const totalTendik = siteData.ptk.filter(p => p.kategori === 'tendik').length;

      return `
        <div class="animate-page space-y-6">
          ${buildPageHero({
            icon: 'fa-chalkboard-teacher',
            title: activeTab === 'tendik' ? 'Direktori Tenaga Administrasi' : 'Direktori Pendidik & Tenaga Kependidikan',
            subtitle: 'Profil lengkap Guru dan Staf Tata Usaha beserta kualifikasi pendidikan terakhir di SMP Negeri 02 Martapura.',

          })}

            <div class="glossy-panel rounded-2xl p-4 flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-xl bg-sky-100 text-[#062d68] flex items-center justify-center text-lg"><i class="fas fa-users"></i></div>
              <div>
                <p class="text-xl font-extrabold text-[#062d68]">${siteData.statistik.guru + siteData.statistik.tendik}</p>
                <p class="text-xs text-slate-500">Total PTK Aktif</p>
              </div>
            </div>
            <div class="glossy-panel rounded-2xl p-4 flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-xl bg-blue-100 text-[#0b469e] flex items-center justify-center text-lg"><i class="fas fa-chalkboard-user"></i></div>
              <div>
                <p class="text-xl font-extrabold text-[#062d68]">${siteData.statistik.guru}</p>
                <p class="text-xs text-slate-500">Tenaga Pendidik (Guru)</p>
              </div>
            </div>
            <div class="glossy-panel rounded-2xl p-4 flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg"><i class="fas fa-user-tie"></i></div>
              <div>
                <p class="text-xl font-extrabold text-[#062d68]">${siteData.statistik.tendik}</p>
                <p class="text-xs text-slate-500">Tenaga Administrasi</p>
              </div>
            </div>
            <div class="glossy-panel rounded-2xl p-4 flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-lg"><i class="fas fa-graduation-cap"></i></div>
              <div>
                <p class="text-xl font-extrabold text-[#062d68]">94%</p>
                <p class="text-xs text-slate-500">Kualifikasi S1 / S2</p>
              </div>
            </div>
          </div>

          <!-- Bar Tab Kategori + Filter Status & Pendidikan Terakhir + Pencarian -->
          <div class="glossy-panel rounded-3xl p-5 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap gap-2">
                <button onclick="setPtkTab('semua')" class="px-4 py-2 rounded-full text-xs font-bold transition cursor-pointer ${activeTab === 'semua' ? 'bg-[#062d68] text-white shadow' : 'bg-white text-[#0b469e] border border-blue-200 hover:bg-sky-50'}">
                  Semua PTK (${totalGuru + totalTendik})
                </button>
                <button onclick="setPtkTab('guru')" class="px-4 py-2 rounded-full text-xs font-bold transition cursor-pointer ${activeTab === 'guru' ? 'bg-[#062d68] text-white shadow' : 'bg-white text-[#0b469e] border border-blue-200 hover:bg-sky-50'}">
                  Guru (${totalGuru})
                </button>
                <button onclick="setPtkTab('tendik')" class="px-4 py-2 rounded-full text-xs font-bold transition cursor-pointer ${activeTab === 'tendik' ? 'bg-[#062d68] text-white shadow' : 'bg-white text-[#0b469e] border border-blue-200 hover:bg-sky-50'}">
                  Tenaga Administrasi (${totalTendik})
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-2.5 w-full lg:w-auto">
                <select onchange="ptkState.eduFilter = this.value; renderPage(currentPage)" class="px-3.5 py-2 rounded-full bg-white border border-blue-200 text-xs font-semibold text-[#062d68] focus:outline-none">
                  <option value="Semua" ${ptkState.eduFilter === 'Semua' ? 'selected' : ''}>Semua Pendidikan</option>
                  <option value="S2" ${ptkState.eduFilter === 'S2' ? 'selected' : ''}>Jenjang S2</option>
                  <option value="S1" ${ptkState.eduFilter === 'S1' ? 'selected' : ''}>Jenjang S1</option>
                  <option value="D3" ${ptkState.eduFilter === 'D3' ? 'selected' : ''}>Jenjang D3</option>
                  <option value="SMA" ${ptkState.eduFilter === 'SMA' ? 'selected' : ''}>SMA / Sederajat</option>
                </select>
                <select onchange="ptkState.filter = this.value; renderPage(currentPage)" class="px-3.5 py-2 rounded-full bg-white border border-blue-200 text-xs font-semibold text-[#062d68] focus:outline-none">
                  <option value="Semua" ${ptkState.filter === 'Semua' ? 'selected' : ''}>Semua Status</option>
                  <option value="PNS" ${ptkState.filter === 'PNS' ? 'selected' : ''}>PNS</option>
                  <option value="PPPK" ${ptkState.filter === 'PPPK' ? 'selected' : ''}>PPPK</option>
                  <option value="Honorer" ${ptkState.filter === 'Honorer' ? 'selected' : ''}>Honorer</option>
                </select>
                <div class="relative flex-1 sm:w-56">
                  <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                  <input type="text" value="${ptkState.search}" oninput="ptkState.search = this.value; renderPage(currentPage)" placeholder="Cari nama, mapel, pendidikan..." class="w-full pl-9 pr-3 py-2 rounded-full bg-white border border-blue-200 text-xs focus:outline-none focus:border-[#0b469e]" />
                </div>
              </div>
            </div>

            <!-- Kontrol Geser Carousel PTK -->
            <div class="flex items-center justify-between pt-2 border-t border-blue-100">
              <p class="text-xs text-slate-500">Geser ke samping atau gunakan tombol panah untuk melihat profil lengkap (${filtered.length} ditampilkan)</p>
              <div class="flex items-center gap-2">
                <button onclick="scrollCarousel('ptkCarousel', -320)" class="w-9 h-9 rounded-full bg-white hover:bg-[#062d68] text-[#062d68] hover:text-white border border-blue-200 flex items-center justify-center transition cursor-pointer">
                  <i class="fas fa-chevron-left text-xs"></i>
                </button>
                <button onclick="scrollCarousel('ptkCarousel', 320)" class="w-9 h-9 rounded-full bg-white hover:bg-[#062d68] text-[#062d68] hover:text-white border border-blue-200 flex items-center justify-center transition cursor-pointer">
                  <i class="fas fa-chevron-right text-xs"></i>
                </button>
              </div>
            </div>

            <!-- Carousel Kartu PTK Mode Geser Horizontal -->
            <div id="ptkCarousel" class="flex gap-4 overflow-x-auto no-scrollbar pb-2 scroll-smooth">
              ${filtered.length ? filtered.map(p => `
                <div class="min-w-[260px] sm:min-w-[280px] rounded-3xl bg-gradient-to-b from-white to-sky-50/80 border border-blue-200/90 p-5 flex flex-col items-center text-center shadow-xs card-hover flex-shrink-0">
                  <div class="relative mb-3">
                    <img src="${p.foto}" onerror="this.src='https://placehold.co/200x200/0b469e/fde047?text=PTK'" alt="${p.nama}" class="w-20 h-20 rounded-2xl object-cover border-2 border-blue-200 shadow" />
                    <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 px-2.5 py-0.5 rounded-full bg-[#062d68] text-amber-300 text-[10px] font-bold shadow">
                      ${p.status}
                    </span>
                  </div>
                  <h4 class="text-sm font-extrabold text-[#062d68] mt-1 line-clamp-1" title="${p.nama}">${p.nama}</h4>
                  <p class="text-xs font-semibold text-[#0b469e] mt-1">${p.jabatan}</p>
                  <div class="mt-2.5 px-3 py-1 rounded-full bg-white border border-blue-200/90 text-[11px] font-semibold text-[#062d68] inline-flex items-center gap-1.5 max-w-full shadow-2xs" title="Pendidikan Terakhir: ${p.pendidikan || '-'}">
                    <i class="fas fa-graduation-cap text-[#0b469e] flex-shrink-0"></i>
                    <span class="truncate">${p.pendidikan || '-'}</span>
                  </div>
                  <p class="text-[11px] text-slate-400 mt-2 font-mono">NIP. ${p.nip}</p>
                </div>
              `).join('') : `<p class="text-xs text-slate-500 py-8 text-center w-full">Tidak ada data PTK yang cocok dengan filter pencarian.</p>`}
            </div>
          </div>
        </div>
      `;
    }

    function setPtkTab(tab) {
      ptkState.tab = tab;
      currentPage = 'ptk-custom';
      renderPage('ptk-custom');
    }

    function scrollCarousel(id, offset) {
      const el = document.getElementById(id);
      if (el) el.scrollBy({ left: offset, behavior: 'smooth' });
    }

    // =========================================================================
    // 8. HALAMAN SISWA – DATA & ROMBEL (6 / 8 / 7 SLOT KELAS)
    // =========================================================================
    function renderRombelPage() {
      const list = siteData.rombel[rombelActive] || [];
      const totalVII = siteData.rombel.VII.reduce((a, b) => a + b.laki + b.perempuan, 0);
      const totalVIII = siteData.rombel.VIII.reduce((a, b) => a + b.laki + b.perempuan, 0);
      const totalIX = siteData.rombel.IX.reduce((a, b) => a + b.laki + b.perempuan, 0);

      return `
        <div class="animate-page space-y-6">
          ${buildPageHero({
            icon: 'fa-users',

              <p class="text-2xl font-extrabold text-[#0b469e] mt-1">${totalVII} <span class="text-xs font-normal text-slate-400">Siswa</span></p>
            </div>
            <div class="glossy-panel rounded-2xl p-4">
              <p class="text-xs text-slate-500 font-semibold">Tingkat VIII (${siteData.rombel.VIII.length} Rombel)</p>
              <p class="text-2xl font-extrabold text-[#1d63dc] mt-1">${totalVIII} <span class="text-xs font-normal text-slate-400">Siswa</span></p>
            </div>
            <div class="glossy-panel rounded-2xl p-4">
              <p class="text-xs text-slate-500 font-semibold">Tingkat IX (${siteData.rombel.IX.length} Rombel)</p>
              <p class="text-2xl font-extrabold text-amber-600 mt-1">${totalIX} <span class="text-xs font-normal text-slate-400">Siswa</span></p>
            </div>
          </div>

          <!-- Pemilih Tingkat Kelas -->
          <div class="glossy-panel rounded-3xl p-6 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex flex-wrap gap-2">

                  <button onclick="rombelActive = '${tk}'; renderPage('siswa-rombel')" class="px-5 py-2.5 rounded-full text-xs font-extrabold transition cursor-pointer ${rombelActive === tk ? 'bg-[#062d68] text-white shadow-md' : 'bg-white text-[#0b469e] hover:bg-sky-50 border border-blue-200'}">
                    Tingkat ${tk} (${siteData.rombel[tk].length} Slot Kelas)
                  </button>
                `).join('')}
              </div>
              <span class="text-xs font-semibold text-slate-500">Klik kartu kelas untuk melihat rincian</span>
            </div>

            <!-- Grid Slot Kelas -->
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              ${list.map(r => {
                const total = r.laki + r.perempuan;
                return `
                  <div onclick="openRombelModal('${rombelActive}', '${r.kelas}')" class="rounded-2xl bg-gradient-to-br from-white to-sky-50/80 border border-blue-200 p-5 card-hover cursor-pointer space-y-3">

    function renderPengumumanPage() {
      const cat = pengumumanState.category;
      const q = pengumumanState.search.toLowerCase();
      const categories = [
        { name: 'Semua', label: 'Semua Pengumuman', icon: 'fa-th-large', count: siteData.pengumuman.length },
        { name: 'Akademik', label: 'Akademik', icon: 'fa-graduation-cap', count: siteData.pengumuman.filter(p => p.kategori === 'Akademik').length },
        { name: 'Kesiswaan', label: 'Kesiswaan', icon: 'fa-users', count: siteData.pengumuman.filter(p => p.kategori === 'Kesiswaan').length },
        { name: 'Kegiatan Sekolah', label: 'Kegiatan Sekolah', icon: 'fa-calendar-check', count: siteData.pengumuman.filter(p => p.kategori === 'Kegiatan Sekolah').length },
        { name: 'Ekstrakurikuler', label: 'Ekstrakurikuler', icon: 'fa-trophy', count: siteData.pengumuman.filter(p => p.kategori === 'Ekstrakurikuler').length },
        { name: 'Info Sekolah', label: 'Info Sekolah', icon: 'fa-circle-info', count: siteData.pengumuman.filter(p => p.kategori === 'Info Sekolah').length }
      ];

      const filtered = siteData.pengumuman.filter(p => {
        const matchCat = cat === 'Semua' || p.kategori === cat;
        const matchQ = !q || p.judul.toLowerCase().includes(q) || p.ringkasan.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      return `
        <div class="animate-page space-y-6">
          ${buildPageHero({
            icon: 'fa-bullhorn',
            title: 'Pengumuman Sekolah',
            subtitle: `Informasi resmi dan terbaru dari ${siteData.sekolah.namaLengkap}.`,
            breadcrumb: ['Informasi', 'Pengumuman Sekolah']

                <h2 class="font-extrabold text-sm sm:text-base">Kategori Pengumuman</h2>
              </div>
              <div class="p-3.5 space-y-1.5">
                ${categories.map(c => {
                  const active = cat === c.name;
                  return `
                    <button onclick="pengumumanState.category = '${c.name}'; renderPage('pengumuman')" class="w-full px-3.5 py-2.5 rounded-2xl flex items-center justify-between text-xs font-bold transition cursor-pointer ${active ? 'bg-gradient-to-r from-[#8fc5fb] to-[#cde5ff] text-[#062d68] border-l-4 border-[#0b469e] shadow-2xs' : 'text-slate-600 hover:bg-white'}">
                      <span class="flex items-center gap-2.5">
                        <i class="fas ${c.icon} w-4 text-center ${active ? 'text-[#062d68]' : 'text-[#0b469e]'}"></i>
                        <span>${c.label}</span>
                      </span>
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] ${active ? 'bg-[#062d68] text-white' : 'bg-white border border-blue-200 text-[#062d68]'}">${c.count}</span>
                    </button>
                  `;
                }).join('')}
              </div>
              <!-- Gelombang Biru Royal + Emas Bawah Kartu Kategori -->
              <svg viewBox="0 0 300 45" class="w-full h-9 block" preserveAspectRatio="none">
                <path d="M0,45 L0,10 C95,35 190,42 300,25 L300,45 Z" fill="#062d68"></path>
                <path d="M0,10 C95,35 190,42 300,25" fill="none" stroke="#eab308" stroke-width="3"></path>
              </svg>
            </div>

            <!-- Kolom Kanan: Daftar Pengumuman Terbaru -->
            <div class="lg:col-span-8 glossy-panel rounded-3xl overflow-hidden">
              <div class="px-5 py-3.5 royal-panel-header text-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                </div>
              </div>

              <div class="p-4 sm:p-5 space-y-4">
                ${filtered.length ? filtered.map((p, idx) => {
                  const iconBox = idx % 3 === 0
                    ? 'from-sky-100 to-blue-100 text-[#1d63dc] border-blue-200'

                    ? 'from-amber-100 to-yellow-50 text-amber-600 border-amber-200'
                    : 'from-indigo-100 to-blue-50 text-indigo-600 border-indigo-200';
                  const badgeStyle = idx % 3 === 0
                    ? 'bg-[#1d63dc] text-white'
                    : idx % 3 === 1
                    ? 'bg-amber-500 text-white'
                    : 'bg-indigo-600 text-white';
                  const iconName = idx % 3 === 0 ? 'fa-calendar-check' : idx % 3 === 1 ? 'fa-trophy' : 'fa-file-signature';
                  return `
                    <div class="rounded-2xl bg-white border border-blue-200/90 p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 card-hover">

                        <span>Baca Selengkapnya</span>
                        <i class="fas fa-arrow-right text-[10px]"></i>
                      </button>
                    </div>
                  `;
                }).join('') : `<p class="text-xs text-slate-500 text-center py-8">Tidak ditemukan pengumuman yang sesuai.</p>`}
              </div>
            </div>
          </div>
        </div>

      openGlobalModal(p.judul, `
        <div class="space-y-4">

        const params = new URLSearchParams(window.location.search);
        const queryCode = (params.get('akses') || '').trim();
        const hashCode = window.location.hash.replace(/^#/, '').trim();
        const isValidSecret =
          encodeSecret(queryCode) === URL_SECRET_HASH ||
          encodeSecret(hashCode) === URL_SECRET_HASH;
        if (isValidSecret) {
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', window.location.pathname);
          }
          if (adminState.unlocked) {
            navigate('admin');
          } else {
            openAdminGate();
          }
        }
      } catch (e) {
        console.warn('Pemeriksaan tautan akses:', e);
      }
    }

        </div>
      `;
    }

    function handlePhotoFileUpload(event, inputId, previewId) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 640;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          const inp = document.getElementById(inputId);
          const prev = document.getElementById(previewId);
          if (inp) inp.value = compressed;
          if (prev) prev.src = compressed;
          showToast('Foto berhasil dimuat! Klik Simpan untuk menerapkan.');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Ekspor & Impor Data PTK (Guru & Tendik) ke Excel (.xlsx) dengan Kolom Pendidikan Terakhir
    function exportPtkExcel() {
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap, coba muat ulang halaman.');
        return;
      }
      const rows = siteData.ptk.map(p => ({
        'Nama Lengkap & Gelar': p.nama,
        'NIP / NI PPPK': p.nip,
        'Kategori (guru/tendik)': p.kategori,
        'Mata Pelajaran / Jabatan': p.jabatan,
        'Pendidikan Terakhir': p.pendidikan || '-',
        'Status (PNS/PPPK/Honorer)': p.status
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Data_PTK');
      XLSX.writeFile(wb, 'Data_Guru_Tendik_SMPN02_Martapura.xlsx');
      showToast('File Excel PTK (termasuk Pendidikan Terakhir) berhasil diunduh.');
    }

    function importPtkExcel(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      if (typeof XLSX === 'undefined') {
        showToast('Library Excel belum siap.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(sheet);
          if (!rawRows.length) {
            showToast('File Excel kosong.');
            return;
          }
          const imported = rawRows.map(r => {
            const nama = String(r['Nama Lengkap & Gelar'] || r['Nama'] || '').trim();
            const nip = String(r['NIP / NI PPPK'] || r['NIP'] || '-').trim();
            const katRaw = String(r['Kategori (guru/tendik)'] || r['Kategori'] || 'guru').toLowerCase();
            const kategori = katRaw.includes('tendik') || katRaw.includes('admin') ? 'tendik' : 'guru';
            const jabatan = String(r['Mata Pelajaran / Jabatan'] || r['Jabatan'] || '-').trim();
            const pendidikan = String(r['Pendidikan Terakhir'] || r['Pendidikan'] || inferPendidikanFromName(nama)).trim();
            const status = String(r['Status (PNS/PPPK/Honorer)'] || r['Status'] || 'PNS').trim();
            const initials = nama.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || 'PTK';
            return {
              nama,
              nip,
              kategori,
              jabatan,
              pendidikan,
              status,
              foto: `https://placehold.co/200x200/0b469e/fde047?text=${encodeURIComponent(initials)}`
            };
          }).filter(item => item.nama);

          if (!imported.length) {
            showToast('Kolom Nama tidak ditemukan di file Excel.');
            return;
          }
          siteData.ptk = imported;
          saveSiteDataToStorage();
          renderPage('admin');
          showToast(`Berhasil mengimpor ${imported.length} data Guru & Tendik dari Excel!`);
        } catch (err) {
          showToast('Gagal membaca file Excel: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

      siteData.sekolah.kepalaSekolah.sambutan = document.getElementById('admSambutan').value.trim() || siteData.sekolah.kepalaSekolah.sambutan;
      siteData.sekolah.visi = document.getElementById('admVisi').value.trim() || siteData.sekolah.visi;
      const misiLines = document.getElementById('admMisi').value.split('\n').map(l => l.trim()).filter(Boolean);
      if (misiLines.length) siteData.sekolah.misi = misiLines;
      siteData.statistik.pesertaDidik = parseInt(document.getElementById('admJmlSiswa').value, 10) || siteData.statistik.pesertaDidik;
      siteData.statistik.guru = parseInt(document.getElementById('admJmlGuru').value, 10) || siteData.statistik.guru;
      siteData.statistik.tendik = parseInt(document.getElementById('admJmlTendik').value, 10) || siteData.statistik.tendik;
      siteData.statistik.rombel = parseInt(document.getElementById('admJmlRombel').value, 10) || siteData.statistik.rombel;
      const newPin = document.getElementById('admNewPin').value.trim();
      if (newPin) {
        const encoded = encodeSecret(newPin);
        adminState.passHash = encoded;
        try { localStorage.setItem('smpn02_admin_auth_v2', encoded); } catch (e) {}
      }
      saveSiteDataToStorage();
      showToast('Identitas, foto sekolah, visi & misi berhasil disimpan!');
      renderPage('admin');
    }

    function saveAdminPengumuman() {

      const ringkasan = document.getElementById('admPengRingkas').value.trim();

        showToast('Mohon isi judul dan ringkasan pengumuman.');

        siteData.pengumuman[adminState.editPengIdx] = { ...existing, judul, kategori, tanggal, ringkasan, isiLengkap };
        adminState.editPengIdx = -1;

        siteData.pengumuman.unshift({ id: Date.now(), kategori, tanggal, judul, ringkasan, isiLengkap });

      renderPage('admin');

    function deleteAdminItem(collectionKey, idx) {
      if (!Array.isArray(siteData[collectionKey])) return;
      siteData[collectionKey].splice(idx, 1);
      saveSiteDataToStorage();
      showToast('Data berhasil dihapus.');
      renderPage('admin');
    }

    function applyRawJson() {
      try {
        const raw = document.getElementById('rawJsonEditor').value;
        const parsed = JSON.parse(raw);
        siteData = parsed;
        saveSiteDataToStorage();
        showToast('Data JSON valid dan berhasil diterapkan!');
      } catch (err) {
        showToast('Format JSON tidak valid: ' + err.message);
      }
    }

    function downloadJsonFile() {
      const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data-smpn02-martapura.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('File data-smpn02-martapura.json berhasil diunduh.');
    }

    function uploadJsonFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          siteData = parsed;
          saveSiteDataToStorage();
          renderPage('admin');
          showToast('File JSON berhasil diimpor!');
        } catch (err) {
          showToast('Gagal membaca file JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      siteData = JSON.parse(JSON.stringify(defaultSiteData));
      saveSiteDataToStorage();
      renderPage('admin');
      showToast('Seluruh data dikembalikan ke pengaturan awal.');
    }

    // =========================================================================

    function openGlobalModal(title, htmlBody) {
      const modal = document.getElementById('globalModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = htmlBody;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeGlobalModal() {
      const modal = document.getElementById('globalModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
